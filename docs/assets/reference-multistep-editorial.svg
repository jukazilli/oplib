<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="755" viewBox="0 0 1260 755" role="img" aria-labelledby="title desc">
  <title id="title">Referência de fluxo editorial multi-etapas</title>
  <desc id="desc">Estrutura com progresso lateral em seis etapas e formulário da etapa atual na área principal.</desc>
  <rect width="1260" height="755" fill="#f4f5f7"/>
  <rect x="48" y="42" width="1164" height="671" rx="26" fill="#ffffff"/>
  <rect x="64" y="55" width="300" height="658" rx="20" fill="#f0f4f8"/>
  <text x="100" y="94" fill="#17212b" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">OPALIB</text>
  <g font-family="Arial, sans-serif" fill="#17212b">
    <line x1="114" y1="165" x2="114" y2="650" stroke="#c6d1d9" stroke-width="2"/>
    <g transform="translate(0 0)"><circle cx="114" cy="153" r="12" fill="#17212b"/><text x="110" y="158" fill="#fff" font-size="13">1</text><text x="140" y="158" font-size="16" font-weight="700">Informações</text><text x="140" y="180" fill="#52606d" font-size="13">Título, resumo e taxonomia</text></g>
    <g transform="translate(0 100)"><circle cx="114" cy="153" r="12" fill="#fff" stroke="#52606d"/><text x="110" y="158" font-size="13">2</text><text x="140" y="158" font-size="16" font-weight="700">Conteúdo</text><text x="140" y="180" fill="#52606d" font-size="13">Markdown e prévia</text></g>
    <g transform="translate(0 200)"><circle cx="114" cy="153" r="12" fill="#fff" stroke="#52606d"/><text x="110" y="158" font-size="13">3</text><text x="140" y="158" font-size="16" font-weight="700">Capa</text><text x="140" y="180" fill="#52606d" font-size="13">Imagem e texto alternativo</text></g>
    <g transform="translate(0 300)"><circle cx="114" cy="153" r="12" fill="#fff" stroke="#52606d"/><text x="110" y="158" font-size="13">4</text><text x="140" y="158" font-size="16" font-weight="700">Referências</text><text x="140" y="180" fill="#52606d" font-size="13">Bibliografia e links</text></g>
    <g transform="translate(0 400)"><circle cx="114" cy="153" r="12" fill="#fff" stroke="#52606d"/><text x="110" y="158" font-size="13">5</text><text x="140" y="158" font-size="16" font-weight="700">Revisão</text><text x="140" y="180" fill="#52606d" font-size="13">Prévia e validações</text></g>
    <g transform="translate(0 500)"><circle cx="114" cy="153" r="12" fill="#fff" stroke="#52606d"/><text x="110" y="158" font-size="13">6</text><text x="140" y="158" font-size="16" font-weight="700">Publicação</text><text x="140" y="180" fill="#52606d" font-size="13">Confirmar e publicar</text></g>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="403" y="65" width="80" height="36" rx="7" fill="#fff" stroke="#d9e1e6"/><text x="428" y="88" fill="#17212b" font-size="14">Voltar</text>
    <text x="403" y="150" fill="#52606d" font-size="14">Etapa 1 de 6</text>
    <text x="403" y="190" fill="#17212b" font-size="30" font-weight="700">Informações</text>
    <text x="403" y="217" fill="#52606d" font-size="15">Identifique a publicação e organize sua descoberta.</text>
    <line x1="403" y1="246" x2="1160" y2="246" stroke="#d9e1e6"/>
    <text x="403" y="292" fill="#17212b" font-size="14" font-weight="700">Título</text><rect x="403" y="308" width="757" height="44" rx="7" fill="#fff" stroke="#c6d1d9"/>
    <text x="403" y="394" fill="#17212b" font-size="14" font-weight="700">Resumo</text><rect x="403" y="410" width="757" height="92" rx="7" fill="#fff" stroke="#c6d1d9"/>
    <text x="403" y="548" fill="#17212b" font-size="14" font-weight="700">Tipo</text><rect x="403" y="564" width="356" height="44" rx="7" fill="#fff" stroke="#c6d1d9"/>
    <text x="804" y="548" fill="#17212b" font-size="14" font-weight="700">Área</text><rect x="804" y="564" width="356" height="44" rx="7" fill="#fff" stroke="#c6d1d9"/>
    <rect x="1038" y="650" width="122" height="42" rx="7" fill="#326f8d"/><text x="1072" y="676" fill="#fff" font-size="14" font-weight="700">Continuar</text>
  </g>
</svg>
