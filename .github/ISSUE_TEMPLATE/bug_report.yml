name: Relatar problema
description: Registre um comportamento incorreto ou regressão.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Descreva o que aconteceu e o impacto.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
      description: Informe passos mínimos e dados de teste não sensíveis.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão ou commit
  - type: checkboxes
    id: safety
    attributes:
      label: Segurança
      options:
        - label: Confirmei que este relato não contém segredos nem dados pessoais desnecessários.
          required: true
